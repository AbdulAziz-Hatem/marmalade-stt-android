name: CI & Build Side-by-Side Release APK

on:
  push:
    branches: [ main, feature/** ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NDK and CMake
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Run Unit Tests
        run: |
          ./gradlew test --stacktrace

      - name: Assemble Minified Side-by-Side Release APK (arm64-v8a)
        run: |
          ./gradlew -PabiFilters=arm64-v8a -PsmokeRelease :app:assembleFdroidRelease --stacktrace

      - name: Sign Release APK with Master Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # Locate built APK
          UNSIGNED_APK=$(find app/build/outputs/apk/fdroid/release -name "*.apk" | head -n 1)
          echo "Found APK at: $UNSIGNED_APK"
          
          # Decode persistent master keystore
          echo "$KEYSTORE_BASE64" | base64 -d > master-release.jks
          
          BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0
          if [ ! -d "$BUILD_TOOLS" ]; then
            BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          fi
          
          SIGNED_APK="app/build/outputs/apk/fdroid/release/marmalade-stt-side-by-side-release.apk"
          cp "$UNSIGNED_APK" "$SIGNED_APK"
          
          # Sign using persistent master key (PKCS12 store password unlocks key)
          $BUILD_TOOLS/apksigner sign \
            --ks master-release.jks \
            --ks-pass pass:"$STORE_PASSWORD" \
            --ks-key-alias "$KEYSTORE_ALIAS" \
            "$SIGNED_APK"
            
          echo "=== Signature Verification ==="
          $BUILD_TOOLS/apksigner verify -v "$SIGNED_APK"
          ls -lh "$SIGNED_APK"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: marmalade-stt-side-by-side-release
          path: app/build/outputs/apk/fdroid/release/marmalade-stt-side-by-side-release.apk

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/fdroid/release/marmalade-stt-side-by-side-release.apk
          name: "Marmalade STT (Side-by-Side Release) ${{ github.ref_name }}"
          body: |
            ### Marmalade STT Side-by-Side Release — Offline Model Portability
            
            - **Package Name:** `app.marmalade.stt.rc` (Installs side-by-side with official app, keeping all your current settings and models intact)
            - **Signature:** Signed with permanent master key (`CN=AbdulAziz Hatem`)
            - **Architecture:** `arm64-v8a` (Minified via R8 with compressed C++ runtime, ~15.5 MB)
            
            #### Key Enhancements:
            1. **Local Model Import:** Pick pre-downloaded `.zip` archives via Android SAF with zero integrity risk (strict SHA-256 validation).
            2. **Local Model Export:** Export installed models into `.zip` archives on device storage.
            3. **Direct Link Copy:** Copy direct download links to clipboard in one tap for external downloaders.
            4. **Download Safeguards:** In-flight downloads are cleanly cancelled and intermediate `.part` files wiped on import.
          draft: false
          prerelease: false
