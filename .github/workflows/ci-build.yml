name: CI & Build APK

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NDK and CMake
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Run Unit Tests
        run: |
          ./gradlew test --stacktrace

      - name: Assemble Debug APK (arm64-v8a)
        run: |
          ./gradlew -PabiFilters=arm64-v8a :app:assembleFdroidDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: marmalade-stt-arm64-debug
          path: app/build/outputs/apk/fdroid/debug/app-fdroid-arm64-v8a-debug.apk
