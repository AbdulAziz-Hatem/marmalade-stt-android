name: CI & Build Release APK

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NDK and CMake
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Run Unit Tests
        run: |
          ./gradlew test --stacktrace

      - name: Assemble Minified Release APK (arm64-v8a)
        run: |
          ./gradlew -PabiFilters=arm64-v8a :app:assembleFdroidRelease --stacktrace

      - name: Sign Release APK
        run: |
          # Locate the built release apk
          UNSIGNED_APK=$(find app/build/outputs/apk/fdroid/release -name "*.apk" | head -n 1)
          echo "Found unsigned apk at: $UNSIGNED_APK"
          
          # Generate signing keystore
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias marmalade \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass marmalade2026 \
            -keypass marmalade2026 \
            -dname "CN=AbdulAziz Hatem, OU=OpenSource, O=Marmalade STT, C=YE"

          # Sign with apksigner
          BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0
          if [ ! -d "$BUILD_TOOLS" ]; then
            BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          fi
          
          SIGNED_APK="app/build/outputs/apk/fdroid/release/marmalade-stt-arm64-v8a-release.apk"
          cp "$UNSIGNED_APK" "$SIGNED_APK"
          
          $BUILD_TOOLS/apksigner sign \
            --ks release.jks \
            --ks-pass pass:marmalade2026 \
            --ks-key-alias marmalade \
            --key-pass pass:marmalade2026 \
            "$SIGNED_APK"
            
          $BUILD_TOOLS/apksigner verify -v "$SIGNED_APK"
          ls -lh "$SIGNED_APK"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: marmalade-stt-arm64-v8a-release
          path: app/build/outputs/apk/fdroid/release/marmalade-stt-arm64-v8a-release.apk
