AntiFeatures:
  NonFreeNet:
    en-US: Speech models are downloaded on request from GitHub releases. Recognition
      runs offline once a model is installed.
Categories:
  - Keyboard & IME
  - Speech Recognizer
License: MIT
AuthorName: Maxwell Warren
SourceCode: https://github.com/maxwhipw/marmalade-stt-android
IssueTracker: https://github.com/maxwhipw/marmalade-stt-android/issues
Changelog: https://github.com/maxwhipw/marmalade-stt-android/blob/main/CHANGELOG.md
Donate: https://github.com/sponsors/maxwhipw

AutoName: Marmalade STT

RepoType: git
Repo: https://github.com/maxwhipw/marmalade-stt-android.git

Builds:
  - versionName: 1.0.0
    versionCode: 10000001
    commit: COMMIT_FULL_HASH
    subdir: app
    submodules: true
    gradle:
      - fdroid
    output: build/outputs/apk/fdroid/release/app-fdroid-armeabi-v7a-release-unsigned.apk
    scandelete:
      - third_party/sherpa-onnx
    ndk: r26d

  - versionName: 1.0.0
    versionCode: 10000002
    commit: COMMIT_FULL_HASH
    subdir: app
    submodules: true
    gradle:
      - fdroid
    output: build/outputs/apk/fdroid/release/app-fdroid-arm64-v8a-release-unsigned.apk
    scandelete:
      - third_party/sherpa-onnx
    ndk: r26d

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v\d+\.\d+\.\d+$
VercodeOperation:
  - '%c + 1'
  - '%c + 2'
CurrentVersion: 1.0.0
CurrentVersionCode: 10000002
